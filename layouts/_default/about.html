{{ define "main" }}
  <div class="main about">
    <article class="about-prose">
      <h1>{{ .Title }}</h1>
      {{ with .Params.links }}
        <div class="link-row about-links">
          {{ range . }}<a href="{{ .href }}">{{ .label }} →</a>{{ end }}
        </div>
      {{ end }}
      {{ .Content }}
    </article>

    <pre class="ascii" aria-hidden="true">   ___________________________________
  /                                   \
  |  $ echo "thanks for reading" >> ~  |
  \___________________________________/</pre>
  </div>
{{ end }}
